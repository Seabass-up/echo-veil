name: Build Apple Silicon OpenFHE wheels

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openfhe-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheel:
    name: CPython ${{ matrix.python-version }} / macOS arm64
    runs-on: macos-14
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install native build prerequisites
        run: brew install cmake libomp

      - name: Build and smoke-test the architecture-tagged wheel
        run: >-
          python scripts/build_openfhe_macos.py
          --jobs 3
          --output-dir dist/openfhe-macos-arm64

      - name: Upload non-release wheel for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openfhe-macos-arm64-cp${{ matrix.python-version }}
          path: dist/openfhe-macos-arm64/*.whl
          if-no-files-found: error
          retention-days: 7
