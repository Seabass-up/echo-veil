version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /crates/echo-veil-zkp
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /cloudflare/enclave-gateway
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      worker-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      website-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directory: /deploy/cloudflare
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      infrastructure-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
