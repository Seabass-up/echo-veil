[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-veil"
version = "0.4.0"
description = "A tiered, decay-driven memory architecture for conversational agents (Echo Veil v1.0 core)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Seabass-up" }]
keywords = ["memory", "agents", "vector", "retrieval", "context-management"]
dependencies = ["numpy>=1.24", "cryptography>=42.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/Seabass-up/echo-veil"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
