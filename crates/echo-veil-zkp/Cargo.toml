[package]
name = "echo-veil-zkp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Ristretto255 Schnorr proof-of-possession gate for Echo Veil"

[dependencies]
base64 = "0.22.1"
curve25519-dalek = "5.0.0"
getrandom = "0.3.4"
merlin = "3.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }

[dev-dependencies]
tempfile = "3.24.0"
